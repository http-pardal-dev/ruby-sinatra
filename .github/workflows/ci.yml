# frozen_string_literal: true

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # The application, the Rake tasks and the database configuration all read
  # `test` for the environment that points at `storage/test.sqlite3`
  # (see config/environment.rb and data/database.yml).
  APP_ENV: test

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # Windows needs no extra step here: ruby/setup-ruby already puts the MSYS2
      # toolchain on PATH (it is what compiles the gems that have no precompiled
      # Windows build, like bcrypt) and sqlite3 installs its precompiled
      # x64-mingw-ucrt gem (see PLATFORMS in Gemfile.lock), so nothing is built
      # from source against OpenSSL. Any `$env:` export would also only live for
      # its own step unless written to `$env:GITHUB_ENV`.

      - name: Run database migrations
        run: bundle exec rake db:migrate

      - name: Run the RSpec suite
        # `rake spec` would not work: no `spec` task exists, so rake resolves
        # the spec/ directory as an already-built file task and exits 0 without
        # running a single example. The suite is `rspec` (see Dockerfile).
        run: bundle exec rspec

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rake lint

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  bundle-audit:
    name: Audit (Bundler Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Bundler Audit
        run: bundle exec bundle-audit check --update

