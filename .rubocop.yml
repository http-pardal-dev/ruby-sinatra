# RuboCop configuration, used by the `lint` task (see the Rakefile).
#
# The rules describe the style the project already uses, so `rake lint` reports
# real problems instead of asking the code to change for the rules.

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - ".bundle/**/*"
    - ".snapshot/**/*"
    - "db/schema.rb" # generated by the migrations (rake db:schema:dump)
    - "storage/**/*"
    - "vendor/**/*"

# The project writes every string with double quotes.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Each file opens with a comment block that introduces its classes and modules,
# instead of a one-line comment glued to every definition.
Style/Documentation:
  Enabled: false

# Guards are written as explicit blocks, next to the status code they answer
# with.
Style/IfUnlessModifier:
  Enabled: false

# The steps of the commands (setup, reset) read as a linear sequence: longer
# than a short method, but easier to follow.
Metrics/MethodLength:
  Max: 15

# A spec is a list of examples, and the list is the point: splitting it to
# satisfy a line count would hide one behaviour per `describe` and make the
# suite harder to read, not easier. The example itself is still checked.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# `find_or_404` is the name the routes read: it either finds the record or
# answers 404, and the status code in the name is what tells that. A number in
# a method name is not a problem here.
Naming/VariableNumber:
  Exclude:
    - "helpers/records.rb"

# `Payment.transition!` returns whether the transition happened, but it is a
# command that performs it and may fail, not a question about the record, so it
# keeps the `!` instead of reading as a predicate.
Naming/PredicateMethod:
  Exclude:
    - "models/payment.rb"

# A Gemfile has no frozen string literal comment, like every Gemfile.
Style/FrozenStringLiteralComment:
  Exclude:
    - "Gemfile"